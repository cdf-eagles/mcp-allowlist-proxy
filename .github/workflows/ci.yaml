---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories and registry changes surface without a push.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SNYK_VERSION: 1.1308.4
  SNYK_SHA256: 979172ee128903f50e43fff221f22a0689579f22c086dabaa0d1a5416485b9ba
  PYTHON_VERSION: "3.13.18"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      # Dependabot updates the hook's rev, so both golangci-lint steps take their version from it.
      - name: Read the golangci-lint version from .pre-commit-config.yaml
        id: golangci_lint
        run: |
          set -euo pipefail
          version=$(awk '/repo: https:\/\/github.com\/golangci\/golangci-lint$/ { getline; print $2 }' .pre-commit-config.yaml)
          case "${version}" in
            v[0-9]*.[0-9]*.[0-9]*) echo "version=${version}" >> "${GITHUB_OUTPUT}" ;;
            *) echo "::error::No golangci-lint rev in .pre-commit-config.yaml"; exit 1 ;;
          esac

      - name: Run golangci-lint for Linux
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ steps.golangci_lint.outputs.version }}
          install-mode: goinstall

      - name: Run golangci-lint for macOS
        env:
          GOTOOLCHAIN: local
          GOLANGCI_LINT_REV: ${{ steps.golangci_lint.outputs.version }}
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_REV}"
          GOOS=darwin "$(go env GOPATH)/bin/golangci-lint" run ./...

      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the Python tools
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh scripts/*.sh

      - name: Run yamllint
        run: |
          yamllint --version
          yamllint --strict .

      # golangci-lint runs above and yamllint covers check-yaml; actionlint turns
      # its shellcheck checks off when shellcheck is not on PATH.
      - name: Run actionlint and the remaining pre-commit hooks
        env:
          SKIP: golangci-lint,check-yaml
        run: |
          set -euo pipefail
          command -v shellcheck
          pre-commit --version
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an unshallow clone
        run: test "$(git rev-parse --is-shallow-repository)" = false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto "=https" --tlsv1.2 -sSfL \
            --retry 8 --retry-delay 30 --retry-max-time 300 --retry-all-errors \
            -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Run gitleaks over the history of the checked-out commit
        run: '"${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose --log-opts="HEAD" .'

  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Require 90 percent coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 90) ? 0 : 1 }'

      - name: Run govulncheck
        run: go tool -modfile=ci/tools/go.mod govulncheck ./...

      # Snyk finds no packages in ci/tools/go.mod, which holds only tool
      # directives, so it tests none of the tools' dependencies. Build
      # govulncheck from that module and scan the binary's embedded module
      # list; a called vulnerability fails the job.
      - name: Run govulncheck on the CI tool module
        run: |
          set -euo pipefail
          go build -modfile=ci/tools/go.mod -trimpath -o "${RUNNER_TEMP}/govulncheck" \
            golang.org/x/vuln/cmd/govulncheck
          "${RUNNER_TEMP}/govulncheck" -mode=binary "${RUNNER_TEMP}/govulncheck"

      - name: Build for macOS and Linux
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/mcp-allowlist-proxy
          done

  servers:
    name: Server allowlists
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build the proxy
        run: CGO_ENABLED=0 go build -o bin/mcp-allowlist-proxy ./cmd/mcp-allowlist-proxy

      - name: Test the server check script
        run: sh scripts/test-check-server-tools.sh bin/mcp-allowlist-proxy

      - name: Check uptime-kuma's tools against its allowlist, hidden list, and tool lock
        run: |
          set -euo pipefail
          test "$(grep -c '^FROM ' servers/uptime-kuma/Dockerfile)" -eq 1
          image=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' servers/uptime-kuma/Dockerfile)
          echo "image: ${image}"
          if ! printf '%s\n' "${image}" | grep -Eq '^[^@ ]+:[^@: ]+@sha256:[0-9a-f]{64}$'; then
            echo "the image in servers/uptime-kuma/Dockerfile is not pinned by tag and full digest" >&2
            exit 1
          fi
          docker pull --quiet "${image}"
          sh scripts/check-server-tools.sh bin/mcp-allowlist-proxy servers/uptime-kuma -- \
            docker run --rm -i --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 512m -e UPTIME_KUMA_URL=http://127.0.0.1:9 "${image}"

      - name: Check pysnyk-mcp's tools against its allowlist, hidden list, and tool lock
        run: |
          set -euo pipefail
          test "$(grep -c '^FROM ' servers/pysnyk-mcp/Dockerfile)" -eq 1
          image=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' servers/pysnyk-mcp/Dockerfile)
          echo "image: ${image}"
          if ! printf '%s\n' "${image}" | grep -Eq '^[^@ ]+:[^@: ]+@sha256:[0-9a-f]{64}$'; then
            echo "the image in servers/pysnyk-mcp/Dockerfile is not pinned by tag and full digest" >&2
            exit 1
          fi
          docker pull --quiet "${image}"
          sh scripts/check-server-tools.sh bin/mcp-allowlist-proxy servers/pysnyk-mcp -- \
            docker run --rm -i --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 512m "${image}"

      - name: Install the Snyk CLI
        run: |
          set -euo pipefail
          curl --proto "=https" --tlsv1.2 -sSfL \
            --retry 8 --retry-delay 30 --retry-max-time 300 --retry-all-errors \
            -o "${RUNNER_TEMP}/snyk" \
            "https://github.com/snyk/cli/releases/download/v${SNYK_VERSION}/snyk-linux"
          echo "${SNYK_SHA256}  ${RUNNER_TEMP}/snyk" | sha256sum -c -
          chmod 755 "${RUNNER_TEMP}/snyk"
          "${RUNNER_TEMP}/snyk" --version

      # Runs the checksum-verified release on the runner, with no token.
      - name: Check snyk-cli's tools against its allowlist, hidden list, and tool lock
        env:
          SNYK_DISABLE_ANALYTICS: "1"
        run: |
          set -euo pipefail
          sh scripts/check-server-tools.sh bin/mcp-allowlist-proxy servers/snyk-cli -- \
            "${RUNNER_TEMP}/snyk" mcp -t stdio --profile=lite --disable-trust

  # Dependabot and fork pull requests receive no OpenID Connect token, so they
  # skip the analysis; main is analysed when their change merges.
  sonarcloud:
    name: SonarCloud
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.actor != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the Python tools
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      # The runner's own AWS command line exchanges the job's OpenID Connect
      # token for a role session that can read only the SonarCloud token, which
      # stays inside this step. sonar-project.properties sets the quality gate
      # wait, so a failed gate fails the step.
      - name: Analyse with SonarCloud
        env:
          ROLE_ARN: ${{ secrets.AWS_SONARCLOUD_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::AWS_SONARCLOUD_ROLE_ARN is not set for this run"
            exit 1
          fi
          oidc=$(curl --proto "=https" --tlsv1.2 -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          creds=$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "gha-sonarcloud-${GITHUB_RUN_ID}" \
            --web-identity-token "${oidc}" \
            --duration-seconds 900 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          read -r key secret session <<< "${creds}"
          echo "::add-mask::${secret}"
          echo "::add-mask::${session}"
          token=$(AWS_ACCESS_KEY_ID="${key}" AWS_SECRET_ACCESS_KEY="${secret}" AWS_SESSION_TOKEN="${session}" \
            aws ssm get-parameter --name /ci/sonarcloud/token --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::${token}"
          unset oidc creds key secret session
          test -n "${token}"
          SONAR_TOKEN="${token}" pysonar

  snyk:
    name: Snyk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The Snyk CLI reads the dependency tree from the installed packages.
      - name: Install the Python tools
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt

      - name: Install the Snyk CLI
        run: |
          set -euo pipefail
          curl --proto "=https" --tlsv1.2 -sSfL \
            --retry 8 --retry-delay 30 --retry-max-time 300 --retry-all-errors \
            -o "${RUNNER_TEMP}/snyk" \
            "https://github.com/snyk/cli/releases/download/v${SNYK_VERSION}/snyk-linux"
          echo "${SNYK_SHA256}  ${RUNNER_TEMP}/snyk" | sha256sum -c -
          chmod 755 "${RUNNER_TEMP}/snyk"
          "${RUNNER_TEMP}/snyk" --version

      # Fails on any high or critical issue in the CI tool pins, on a scan
      # error, and when ci/requirements.txt is missing, so the required check
      # fails closed. Dependabot pull requests read SNYK_TOKEN from the
      # Dependabot secrets.
      - name: Fail on high or critical dependency issues
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_DISABLE_ANALYTICS: 1
        run: |
          set -euo pipefail
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error::SNYK_TOKEN is not set for this run"
            exit 1
          fi
          "${RUNNER_TEMP}/snyk" test --file=ci/requirements.txt --package-manager=pip \
            --command="${RUNNER_TEMP}/venv/bin/python" --severity-threshold=high

  tool-drift:
    name: Tool drift
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: cdf-eagles/.github/.github/workflows/tool-drift.yaml@a3ceea039aa09885488009ee39ac07d9e7cfdefe  # v1.1.1
