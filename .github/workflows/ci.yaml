---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories and registry changes surface without a push.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # Dependabot updates the hook's rev, so both golangci-lint steps take their version from it.
      - name: Read the golangci-lint version from .pre-commit-config.yaml
        id: golangci_lint
        run: |
          set -euo pipefail
          version=$(awk '/repo: https:\/\/github.com\/golangci\/golangci-lint$/ { getline; print $2 }' .pre-commit-config.yaml)
          case "${version}" in
            v[0-9]*.[0-9]*.[0-9]*) echo "version=${version}" >> "${GITHUB_OUTPUT}" ;;
            *) echo "::error::No golangci-lint rev in .pre-commit-config.yaml"; exit 1 ;;
          esac

      - name: Run golangci-lint for Linux
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ steps.golangci_lint.outputs.version }}
          install-mode: goinstall

      - name: Run golangci-lint for macOS
        env:
          GOTOOLCHAIN: local
          GOLANGCI_LINT_REV: ${{ steps.golangci_lint.outputs.version }}
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_REV}"
          GOOS=darwin "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: Install the Python tools
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh scripts/*.sh

      - name: Run yamllint
        run: |
          yamllint --version
          yamllint --strict .

      # golangci-lint runs above and yamllint covers check-yaml; actionlint turns
      # its shellcheck checks off when shellcheck is not on PATH.
      - name: Run actionlint and the remaining pre-commit hooks
        env:
          SKIP: golangci-lint,check-yaml
        run: |
          set -euo pipefail
          command -v shellcheck
          pre-commit --version
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an unshallow clone
        run: test "$(git rev-parse --is-shallow-repository)" = false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Run gitleaks over the history of the checked-out commit
        run: '"${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose --log-opts="HEAD" .'

  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Require 90 percent coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 90) ? 0 : 1 }'

      - name: Run govulncheck
        run: go tool -modfile=ci/tools/go.mod govulncheck ./...

      - name: Build for macOS and Linux
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/mcp-allowlist-proxy
          done

  servers:
    name: Server allowlists
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the proxy
        run: CGO_ENABLED=0 go build -o bin/mcp-allowlist-proxy ./cmd/mcp-allowlist-proxy

      - name: Check uptime-kuma's tools against its allowlist and hidden list
        run: |
          set -euo pipefail
          test "$(grep -c '^FROM ' servers/uptime-kuma/Dockerfile)" -eq 1
          image=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' servers/uptime-kuma/Dockerfile)
          echo "image: ${image}"
          if ! printf '%s\n' "${image}" | grep -Eq '^[^@ ]+:[^@: ]+@sha256:[0-9a-f]{64}$'; then
            echo "the image in servers/uptime-kuma/Dockerfile is not pinned by tag and full digest" >&2
            exit 1
          fi
          docker pull --quiet "${image}"
          sh scripts/check-server-tools.sh bin/mcp-allowlist-proxy servers/uptime-kuma -- \
            docker run --rm -i --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 512m -e UPTIME_KUMA_URL=http://127.0.0.1:9 "${image}"

  tool-drift:
    name: Tool drift
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: cdf-eagles/.github/.github/workflows/tool-drift.yaml@4f61e172889ba89b4b32a8ebdc798d432c507ba7  # v1.0.0
