---
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G204
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
          - unparam
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cdf-eagles/mcp-allowlist-proxy
